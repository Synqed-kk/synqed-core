name: Family pack and correction contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  family-pack-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: family_pack_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/family_pack_contract
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Create disposable schema and SQL-defined audit protections
        run: |
          npx prisma db push
          node scripts/setup-family-pack-tests.mjs
      - name: Family final-unit serialization, erasure and pack API compatibility
        run: npx vitest run tests/linked-pack-sharing.test.ts tests/pack-corrections.test.ts
